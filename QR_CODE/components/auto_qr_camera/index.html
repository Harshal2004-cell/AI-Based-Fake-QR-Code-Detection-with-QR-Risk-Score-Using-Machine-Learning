<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <script src="https://unpkg.com/streamlit-component-lib@2.0.0/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    html, body { margin:0; padding:0; background:transparent; font-family:Arial,sans-serif; }
    .wrap { width:100%; max-width:760px; margin:0 auto; }
    video { width:100%; max-height:62vh; object-fit:cover; border-radius:12px; display:block; background:#111; }
    canvas { display:none; }
    .status { padding:8px 0; font-size:14px; }
    .ok { font-weight:700; }
    img { width:100%; max-height:62vh; object-fit:contain; border-radius:12px; display:none; background:#111; }
  </style>
</head>
<body>
<div class="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <img id="shot" alt="Captured QR image">
  <div id="status" class="status">Requesting camera permission…</div>
</div>
<script>
(function () {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const shot = document.getElementById('shot');
  const status = document.getElementById('status');
  let stream = null;
  let scanning = true;
  let busy = false;

  function setHeight() {
    try { Streamlit.setFrameHeight(document.body.scrollHeight + 8); } catch (e) {}
  }

  function finish(text) {
    if (!scanning) return;
    scanning = false;
    const w = video.videoWidth || 640;
    const h = video.videoHeight || 480;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    shot.src = canvas.toDataURL('image/jpeg', 0.82);
    shot.style.display = 'block';
    video.style.display = 'none';
    status.textContent = '✅ QR code detected and captured automatically.';
    status.className = 'status ok';
    if (stream) stream.getTracks().forEach(t => t.stop());
    try { Streamlit.setComponentValue(text); } catch (e) {}
    setHeight();
  }

  async function scanWithBarcodeDetector() {
    if (!('BarcodeDetector' in window)) return false;
    let detector;
    try {
      detector = new BarcodeDetector({formats:['qr_code']});
    } catch (e) {
      return false;
    }
    const loop = async () => {
      if (!scanning) return;
      if (!busy && video.readyState >= 2) {
        busy = true;
        try {
          const codes = await detector.detect(video);
          if (codes && codes.length && codes[0].rawValue) {
            finish(codes[0].rawValue);
            return;
          }
        } catch (e) {}
        busy = false;
      }
      setTimeout(loop, 120);
    };
    loop();
    return true;
  }

  function scanWithJsQR() {
    const loop = () => {
      if (!scanning) return;
      if (video.readyState >= 2 && !busy && typeof jsQR === 'function') {
        busy = true;
        try {
          const w = video.videoWidth || 640;
          const h = video.videoHeight || 480;
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d', {willReadFrequently:true});
          ctx.drawImage(video, 0, 0, w, h);
          const image = ctx.getImageData(0, 0, w, h);
          let code = jsQR(image.data, image.width, image.height, {inversionAttempts:'attemptBoth'});

          // Also try a centered/upscaled crop. This improves detection when the QR
          // is a photo/screenshot displayed on another phone, monitor, or paper and
          // occupies only part of the camera frame.
          if (!code) {
            const cropW = Math.floor(w * 0.72);
            const cropH = Math.floor(h * 0.72);
            const sx = Math.floor((w - cropW) / 2);
            const sy = Math.floor((h - cropH) / 2);
            const scale = Math.min(2, 1280 / Math.max(cropW, cropH));
            const cw = Math.max(1, Math.floor(cropW * scale));
            const ch = Math.max(1, Math.floor(cropH * scale));
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = cw;
            cropCanvas.height = ch;
            const cropCtx = cropCanvas.getContext('2d', {willReadFrequently:true});
            cropCtx.imageSmoothingEnabled = false;
            cropCtx.drawImage(video, sx, sy, cropW, cropH, 0, 0, cw, ch);
            const cropImage = cropCtx.getImageData(0, 0, cw, ch);
            code = jsQR(cropImage.data, cropImage.width, cropImage.height, {inversionAttempts:'attemptBoth'});
          }

          if (code && code.data) {
            finish(code.data);
            return;
          }
        } catch (e) {}
        busy = false;
      }
      setTimeout(loop, 180);
    };
    loop();
  }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.textContent = '❌ Camera is not supported in this browser. Use Upload Image instead.';
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {facingMode: {ideal:'environment'}},
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      status.textContent = '📷 Point the camera at the QR code — it will be captured automatically.';
      setHeight();
      const native = await scanWithBarcodeDetector();
      if (!native) scanWithJsQR();
    } catch (e) {
      status.textContent = '❌ Camera permission was denied or unavailable. Use Upload Image instead.';
      setHeight();
    }
  }

  try { Streamlit.setComponentReady(); } catch (e) {}
  try { Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, setHeight); } catch (e) {}
  start();
})();
</script>
</body>
</html>
